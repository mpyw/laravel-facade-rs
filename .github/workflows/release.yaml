name: Release

# Show the target version in the run title, e.g. "Release 1.2.3".
run-name: "Release ${{ inputs.version }}"

# Dispatched, not triggered by the release being created.
#
# crates.io is where the canonical artifacts land, and a published version can
# never be published again. A GitHub release freezes its tag, so creating one
# before the publish succeeded would burn the version number on a run that
# failed half way. The order here is publish, then release.
#
# Two crates go out: `laravel-facade-macros`, then `laravel-facade`, which pins it with
# `=`. Each one is published only if crates.io does not have it yet, so a run
# that stopped between them can be finished by running again.
#
# crates.io matches the `workflow_ref` claim, which names the top level
# workflow rather than the reusable one it called. Both entry points therefore
# need a trusted publisher configuration, on both crates:
# `tag_and_release.yaml` for the usual path, and `release.yaml` for a retry
# dispatched on its own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3) - tag must already exist"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3) - tag must already exist"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # In publish order: a crate comes after the crates it depends on.
  CRATES: laravel-facade-macros laravel-facade

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # ===========================================================================
  # Everything that can be checked without permission to publish.
  #
  # It is a job of its own so that its log is there to read before the `publish`
  # job's environment gate is answered. An approval on the environment shows the
  # run and not the diff, and reviewing the diff is the point.
  # ===========================================================================
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      unpublished: ${{ steps.plan.outputs.unpublished }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: Invalid version format '$VERSION'"
            echo "Expected format: X.Y.Z or X.Y.Z-prerelease (e.g., 1.2.3, 1.2.0-rc.1)"
            exit 1
          fi
          echo "Version format valid: $VERSION"

      - name: Check tag exists
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git ls-remote --tags "https://github.com/${{ github.repository }}" \
            | grep -q "refs/tags/${VERSION}$"; then
            echo "Error: Tag '$VERSION' does not exist"
            echo "Please create the tag first using the 'Tag' workflow"
            exit 1
          fi
          echo "Tag exists: $VERSION"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --all-targets && cargo test --workspace --doc

      # `--workspace` packages `laravel-facade` against the local `laravel-facade-macros`,
      # so this works before the macro crate is on crates.io.
      - name: Verify the packages
        run: cargo publish --workspace --dry-run

      # A version already on crates.io cannot be published again, and a run
      # that stopped after publishing has to be finishable.
      - name: Work out what is already published
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          unpublished=()
          for crate in $CRATES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: laravel-facade release workflow' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [[ "$code" == "200" ]]; then
              echo "$crate $VERSION is already on crates.io"
            else
              echo "$crate $VERSION is not published yet (HTTP $code)"
              unpublished+=("$crate")
            fi
          done
          echo "unpublished=${unpublished[*]}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Written here, where the reviewer of the environment gate can read it
      # before answering.
      - name: Show the source diff
        env:
          VERSION: ${{ inputs.version }}
        run: |
          prev=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -1 || true)
          {
            echo "## Changes in \`$VERSION\`"
            echo
            if [[ -z "$prev" ]]; then
              echo "No earlier tag to compare against."
            else
              echo "Comparing \`$prev\` to \`$VERSION\`."
              echo
              changed=$(git diff --name-only "$prev" "$VERSION" -- '*.rs' '*Cargo.toml' || true)
              if [[ -z "$changed" ]]; then
                echo "No source file changes."
              else
                for file in $changed; do
                  echo "### \`$file\`"
                  echo '```diff'
                  git diff "$prev" "$VERSION" -- "$file"
                  echo '```'
                  echo
                done
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # The publish, and then the release that freezes the tag.
  # ===========================================================================
  publish:
    needs: [plan]
    runs-on: ubuntu-latest

    # The repository settings can put a reviewer in front of this, and the
    # trusted publisher configuration names the same environment.
    environment: release

    # Naming any permission replaces the whole default set, so both are here.
    permissions:
      # The OIDC token this exchanges for a crates.io one.
      id-token: write
      # `gh release create`.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No token in this repository's secrets. The action asks GitHub for one
      # that says which workflow is running, hands it to crates.io, and gets
      # back one that lasts thirty minutes. Its post step revokes it.
      #
      # Run even when there is nothing left to publish. The exchange proves the
      # trusted publisher configuration still describes this workflow.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # One crate at a time, in dependency order. `cargo publish` waits until
      # the index has each crate, so the next one can resolve it.
      - name: Publish to crates.io
        if: needs.plan.outputs.unpublished != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          UNPUBLISHED: ${{ needs.plan.outputs.unpublished }}
        run: |
          for crate in $UNPUBLISHED; do
            echo "::group::cargo publish -p $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done

      - name: Already published
        if: needs.plan.outputs.unpublished == ''
        run: echo "Both crates are already on crates.io"

      # Last, because it freezes the tag. Everything that can still fail has
      # happened by now. A release that is already there belongs to the run
      # that got this far before, and is left alone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release '$VERSION' already exists"
            exit 0
          fi
          args=(--repo "$REPO" --verify-tag --title "$VERSION" --generate-notes)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          printf '%s\n' \
            "| Crate | Install |" \
            "| --- | --- |" \
            "| \`laravel-facade\` | \`cargo add laravel-facade\` |" \
            "| \`laravel-facade-macros\` | Pulled in by \`laravel-facade\` |" > notes.md
          gh release create "$VERSION" "${args[@]}" --notes-file notes.md
