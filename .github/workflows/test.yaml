name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # The full suite on the compiler users have: unit, integration, trybuild UI,
  # and doctests. The doctests are the README and the rustdoc examples, so a
  # broken example fails here.
  # ===========================================================================
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Test docs
        run: cargo test --workspace --doc

  # ===========================================================================
  # The library on its declared `rust-version`. Only the library: the
  # dev-dependencies (serial_test, trybuild) need a newer compiler, and users
  # never build them.
  # ===========================================================================
  msrv:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check -p laravel-facade -p laravel-facade-macros

  # ===========================================================================
  # Nightly is where a change on its way to stable shows up first. Coverage is
  # measured here too, because `cargo llvm-cov --doctests` needs nightly.
  #
  # The macro expansion is measured through unit tests on `proc_macro2`. Code
  # inside a real `proc_macro` runs in the compiler and is never measured.
  # ===========================================================================
  nightly-and-coverage:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov accepts a GitHub OIDC token instead of a repository secret.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Test, with coverage
        run: cargo +nightly llvm-cov --workspace --doctests --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          fail_ci_if_error: false
          use_oidc: true

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Restore cache
        uses: Swatinem/rust-cache@v2
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Check clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Check sort
        run: cargo sort -w -c
